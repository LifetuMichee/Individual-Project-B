<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>Michee Lifetu | CV</title>
</head>
<body data-page="cv">
    <div class="container">
        <nav id="myTopnav" class="topnav">
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="cv.html" class="active">CV</a>
            <a href="index.html#contact">Contact</a>
            <a href="javascript:void(0);" class="icon" id="navToggle">&#9776;</a>
        </nav>

        <header class="page-head reveal">
            <h1>Curriculum Vitae</h1>
            <p class="tagline">Education, skills and experience.</p>
        </header>

        <section id="skills" class="skills reveal">
            <h2>Skills</h2>
            <button class="action-btn" id="highlightBtn">Highlight Skills</button>
            <ul id="skillsList"></ul>
        </section>

        <section id="education" class="projects reveal">
            <h2>Education</h2>
            <div id="educationList"></div>
        </section>

        <section id="experience" class="projects reveal">
            <h2>Experience</h2>
            <div id="experienceList"></div>
        </section>

        <section id="interests" class="about reveal">
            <h2>Languages &amp; Interests</h2>
            <div id="interestsList"></div>
        </section>

        <footer id="contact" class="reveal">
            <p id="contactLine"></p>
            <p id="contactAddress"></p>
        </footer>
    </div>
</body>
</html>
